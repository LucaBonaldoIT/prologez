<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="An interactive notebook for learning Prolog. Every concept comes with code you can edit and run in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PrologEZ: learn logic programming by running it</title>
    <script>
      try {
        const t = localStorage.getItem('plnb:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
